[package]
name = "libzcashlc"
version = "5.0.0"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre"
]
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.97"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.16" }
# `asm` selects the assembly field arithmetic, where most of 0.6.1's speedup is; without it every
# target gets the portable arithmetic. pasta_curves picks the backend per target itself and has
# none for Apple's x86-64 targets, so the x86_64 slices stay portable. 0.6.0 has no such feature.
pasta_curves = { version = "0.6.1", features = ["asm"] }
ff = "0.14"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
# The scalar types in the Sapling prover traits, named by `rust/src/sapling_prover.rs`.
bls12_381 = "0.9"
jubjub = "0.11"
transparent = { package = "zcash_transparent", version = "=0.11.0", default-features = false }
zcash_address = { version = "=0.14.0" }
zcash_client_backend = { version = "=0.25.0", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "=0.23.0", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = "=0.31.0"
zcash_proofs = "=0.31.0"
zcash_protocol = { version = "=0.11.0", features = ["local-consensus"] }
zcash_pool_migration = { version = "=0.2.0", features = ["wallet"] }
zcash_script = "0.6"
zip32 = "0.3"
pczt = { version = "=0.10.0", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.8"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", rev = "7c90bf1ae504720c3f4b44ff26f996836d8b1553", package = "ur-registry", default-features = false, features = [
    "std",
] }

# Ledger hardware-wallet signing over Bluetooth LE (`rust/src/ledger.rs`).
#
# The sans-I/O APDU engine for the Ledger Zcash app: pairing commands, BLE framing and the PCZT
# signing session. Default features only (`std`); the USB HID and speculos transports stay off,
# since the platform layer moves the bytes. Published from the public zodl-inc/pczt-ledger
# repository.
pczt_ledger = "=0.1.0-pre.0"

# Payment URI parsing (Bitcoin/Litecoin, EIP-681, Solana Pay).
# TODO: temporary git-rev pin -- switch to a published crates.io release once payment_uri ships
# one. Pinned to the zcash/librustzcash#2989 merge commit specifically (not main's moving tip),
# so this doesn't pick up unrelated later changes; that merge commit is a permanent part of
# main's history now, so it stays reachable even as main moves on. iOS keeps 330e4c0a on purpose:
# moving payment_uri would also move eip681, whose parsing changed in later revisions (a stricter
# address-length check, and `from_parts` constructors in place of `from_native_request_parts` and
# `from_erc20_request_parts`), and this SDK's payment-URI parsing would change with it.
eip681 = { git = "https://github.com/zcash/librustzcash.git", rev = "330e4c0aa9e25199acdb93a56bf70126d0d3f2b9" }
payment_uri = { git = "https://github.com/zcash/librustzcash.git", rev = "330e4c0aa9e25199acdb93a56bf70126d0d3f2b9", features = ["json"] }

# Gift cards (`rust/src/liberated_payment.rs`): payment secrets are BIP 39 entropy encoded as
# Bech32m. Descriptions are percent-encoded and legacy payloads are base64url (`base64`, below);
# both crates are librustzcash dependencies already in the lockfile.
bech32 = "0.11"
bip0039 = { version = "0.14", default-features = false, features = ["std"] }
percent-encoding = "2"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
schemerz = "0.3"
schemerz-rusqlite = "0.371"
secrecy = "0.8"
rand = "0.10"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
libc = "0.2"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.14"
tor-rtcompat = "0.43"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting
#
# Coinholder voting core: the zcash_voting 5.x round driver. The `lrz` feature
# selects the librustzcash backend so the crate shares this package's
# zcash_client_sqlite / orchard family instead of pulling the zakura forks.
# Pinned exactly, like every voting release this package has taken: the sidecar
# schema and the wire views move with the crate, so an upgrade is a reviewed change.
#
# 5.2.0-rc.2 is the crates.io release built on the librustzcash release. With `lrz` it shares
# this package's librustzcash crates, so the graph keeps a single copy of each.
zcash_voting = { version = "=5.2.0-rc.2", default-features = false, features = ["lrz"] }
zeroize = "1"

# Used by the pool-migration engine as well as by voting.
zcash_keys = { version = "=0.17.0", features = ["orchard"] }
incrementalmerkletree = { version = "0.9", default-features = false }

# Slipstream engine — the alternative sync engine the SlipstreamSynchronizer
# drives, published to crates.io as `zodl-slipstream` from zodl-inc/slipstream.
# The `[patch.crates-io]` entry below pins the 0.4.0 release until registry publication.
slipstream-core = { version = "=0.4.0", package = "zodl-slipstream" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Plays the device in the Ledger signing tests (`rust/src/ledger/tests.rs`). Matches the engine's
# own secp256k1 (via zcash_transparent) so the two stay one dependency instance, not two.
secp256k1 = "0.33"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "test-util"] }

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []

# GPU-accelerated Orchard subtree building in the engine (wgpu). OFF by
# default — the released libzcashlc links zero wgpu. Enable for local device
# builds via Scripts/init-local-ffi.sh --gpu / rebuild-local-ffi.sh --gpu.
gpu = ["slipstream-core/gpu"]

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

# Build scripts and proc macros, which run on the build machine, stay unstripped. A release build
# strips them by default, and on macOS rustc does that with its bundled rust-objcopy, which writes
# the Mach-O string table straight after the indirect symbol table without padding it to 8 bytes,
# so the string table is misaligned whenever the indirect symbol table has an odd number of
# entries. macOS 27's dyld refuses to load such a proc macro, and the build fails with "mis-aligned
# LINKEDIT string pool" or "can't find crate". BuildSupport/Makefile's MACOSX_DEPLOYMENT_TARGET
# reaches them too, and linked for macOS 14 every one of them came out misaligned. The linker's own
# output is aligned. The static libraries the SDK ships were never stripped, so this setting does
# not apply to them.
[profile.release.build-override]
strip = false

[patch.crates-io]
# Pin the signed zodl_slipstream-0.4.0 release tag by immutable commit hash.
# Keep the Git patch until 0.4.0 is published to crates.io. This release uses the same
# librustzcash generation as the versions above, keeping a single family instance.
zodl-slipstream = { git = "https://github.com/zodl-inc/slipstream.git", rev = "8591b758ca0919058035a2453b41e035f84b2402" }

# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built.
#pczt = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_pool_migration = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
#zip321 = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }

# The Ledger tests build the Orchard proving key once, to extract and verify a proof-bearing
# transaction a device signed. Key generation synthesizes the Orchard circuit, which takes minutes
# in unoptimized halo2 and curve arithmetic and seconds optimized, so the test profile optimizes
# those crates; nothing else, and no other profile, changes.
[profile.test.package.halo2_proofs]
opt-level = 3
[profile.test.package.halo2_gadgets]
opt-level = 3
[profile.test.package.orchard]
opt-level = 3
[profile.test.package.pasta_curves]
opt-level = 3
[profile.test.package.ff]
opt-level = 3
[profile.test.package.group]
opt-level = 3
