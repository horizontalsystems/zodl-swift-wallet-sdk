name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
      # Both implicit on a public repo, required explicitly on a private one: without
      # contents:read the checkout below fails with "repository not found", and
      # upload-sarif needs actions:read to resolve the workflow run on a private repo.
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
        with:
          # Code scanning (SARIF upload) needs GitHub Code Security, which a private repo
          # may not have. There, report findings as workflow annotations instead; a public
          # repo keeps uploading to code scanning.
          advanced-security: ${{ !github.event.repository.private }}
          annotations: ${{ github.event.repository.private }}
