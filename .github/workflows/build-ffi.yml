name: Build FFI XCFramework

on:
  # Manual trigger for preparing releases.
  # The branch selected in the GitHub UI determines which commit is checked out and built.
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version (e.g., 2.5.0)'
        required: true
      force:
        description: 'Replace the assets of an existing release'
        type: boolean
        default: false

permissions: {}

jobs:
  build-xcframework:
    runs-on: macos-15
    permissions:
      contents: write # Required for creating draft releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Authorize cargo against the private slipstream repository
        uses: ./.github/actions/authorize-slipstream
        with:
          app-id: ${{ secrets.SLIPSTREAM_APP_ID }}
          app-private-key: ${{ secrets.SLIPSTREAM_APP_PRIVATE_KEY }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          # Deliberately enumerated rather than caching `~/.cargo` wholesale (which is what
          # Swatinem/rust-cache did): that includes `~/.cargo/git`, where cargo keeps its clone of
          # the PRIVATE zodl-inc/slipstream repo. This repository is public, and GitHub lets
          # workflow runs from forked pull requests restore caches created on the base branch — a
          # cached clone would hand fork PRs the private source without their ever holding the App
          # credential. Re-cloning one small repo per run is the cost of keeping it out.
          #
          # `registry/` is crates.io content and safe to cache. `target/` still holds
          # slipstream-core's compiled rlib/rmeta, which is a far smaller disclosure than the source
          # tree and too expensive to rebuild every run; dropping it too would require solving the
          # public-repo/private-dependency problem properly instead.
          path: |
            target
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v1-

      - name: Build and upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            ./Scripts/prepare-release.sh artifacts --force-overwrite-existing-release "$VERSION"
          else
            ./Scripts/prepare-release.sh artifacts "$VERSION"
          fi

      - name: Report the release artifacts
        run: |
          source BuildSupport/products/release.env
          echo ""
          echo "========================================"
          echo "Draft release ${VERSION} now carries:"
          echo "========================================"
          echo ""
          echo "url:      ${DOWNLOAD_URL}"
          echo "checksum: ${CHECKSUM}"
          echo ""
          echo "From a checkout on candidate/${VERSION}, run:"
          echo "  ./Scripts/prepare-release.sh build --artifacts ci <remote> ${VERSION}"
          echo ""
          echo "It will find this draft release, reuse its checksum, write"
          echo "Package.swift, and mark the release PR ready for review."
