name: Build FFI XCFramework

on:
  # Manual trigger for preparing releases.
  # The branch selected in the GitHub UI determines which commit is checked out and built.
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version (e.g., 2.5.0)'
        required: true
      force:
        description: 'Replace the assets of an existing release'
        type: boolean
        default: false

permissions: {}

jobs:
  build-xcframework:
    # Xcode 27 ships only on this image, which GitHub still marks as a public
    # preview (https://github.com/actions/runner-images/issues/14404). If it
    # misbehaves, macos-26 with Xcode 26.6 is the fallback.
    runs-on: xcode-27
    permissions:
      contents: write # Required for creating draft releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          # Deliberately enumerated rather than caching `~/.cargo` wholesale (which is what
          # Swatinem/rust-cache did): that includes `~/.cargo/git`, where cargo keeps its clones of
          # git dependencies. Every git dependency on main is public today (slipstream, once a
          # private git dependency, now comes from crates.io), but a private one can return — other
          # branches already pull some — and the public twin of this repository lets workflow runs
          # from forked pull requests restore caches created on main. A cached clone would hand those
          # runs the private source without their ever holding a credential for it, so the clones are
          # fetched afresh on every run instead.
          #
          # `registry/` is crates.io content and safe to cache. `target/` holds compiled rlib/rmeta
          # files, never sources: a far smaller disclosure should a private dependency return, and
          # too expensive to rebuild every run.
          path: |
            target
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v1-

      - name: Build and upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            ./Scripts/prepare-release.sh artifacts --force-overwrite-existing-release "$VERSION"
          else
            ./Scripts/prepare-release.sh artifacts "$VERSION"
          fi

      - name: Report the release artifacts
        run: |
          source BuildSupport/products/release.env
          echo ""
          echo "========================================"
          echo "Draft release ${VERSION} now carries:"
          echo "========================================"
          echo ""
          echo "url:      ${DOWNLOAD_URL}"
          echo "checksum: ${CHECKSUM}"
          echo ""
          echo "From a checkout on candidate/${VERSION}, run:"
          echo "  ./Scripts/prepare-release.sh build --artifacts ci <remote> ${VERSION}"
          echo ""
          echo "It will find this draft release, reuse its checksum, write"
          echo "Package.swift, and mark the release PR ready for review."
