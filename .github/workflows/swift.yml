name: Build and Run Offline Tests

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SECURITY.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

  # Pushes to main build too, so that main always holds warm caches: a
  # pull_request run can restore only its own caches and its base branch's, and
  # without these every pull request's first run compiled the whole Rust graph
  # from scratch. Keep this list identical to the one above.
  push:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SECURITY.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

jobs:
  # Checks that the Rust sources are rustfmt-clean. `--check` only reports; it never
  # rewrites. Run `make format-rust` (or `cargo fmt --all`) to fix a failure.
  rustfmt:
    name: rustfmt
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    # The runner image already ships rustup, so no toolchain action is needed.
    - name: Setup Rust
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt
        rustup override set stable

    - name: Rustfmt
      timeout-minutes: 5
      run: make check-format-rust

  build:
    permissions:
      contents: read

    # Xcode 27 ships only on this image, which GitHub still marks as a public
    # preview (https://github.com/actions/runner-images/issues/14404). If it
    # misbehaves, macos-26 with Xcode 26.6 is the fallback.
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_27.0.app/Contents/Developer'

    - name: Run release-script tests
      run: make test-scripts

    # Hash every input of the FFI build for the XCFramework cache key.
    - name: Generate FFI source hash
      id: ffi-hash
      run: |
        # Hash the Rust sources, the Cargo files, the build support files and
        # the root Makefile, whose ffi-ci target decides how CI builds the FFI.
        FFI_HASH=$(find rust Cargo.toml Cargo.lock BuildSupport Makefile -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.lock" -o -name "Makefile" -o -name "*.h" -o -name "*.c" -o -name "*.plist" -o -name "*.modulemap" \) -exec shasum {} \; | sort | shasum | cut -d' ' -f1)
        echo "hash=$FFI_HASH" >> $GITHUB_OUTPUT
        echo "FFI source hash: $FFI_HASH"

    # Cache the XCFramework `make ffi-ci` builds: the arm64 macOS slice, without
    # fat LTO. The key names that build, so a cache of a different one is never
    # restored in its place.
    - name: Cache FFI XCFramework
      id: cache-ffi
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: BuildSupport/products/libzcashlc.xcframework
        key: ffi-xcframework-macos-arm64-nolto-${{ runner.os }}-${{ steps.ffi-hash.outputs.hash }}

    # Needed unconditionally: even on an FFI cache hit, the Rust test step below
    # compiles the crate's test profile and so needs the toolchain. Only the
    # arm64 macOS target: `make ffi-ci` builds nothing else.
    - name: Setup Rust
      id: toolchain
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: stable
        targets: aarch64-apple-darwin

    # Used by both the FFI build and the Rust tests, so it is not conditional on
    # the FFI cache.
    - name: Cache Cargo
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        # Deliberately enumerated rather than caching `~/.cargo` wholesale (which is what
        # Swatinem/rust-cache did): that includes `~/.cargo/git`, where cargo keeps its clones of
        # git dependencies. Every git dependency on main is public today (slipstream, once a
        # private git dependency, now comes from crates.io), but a private one can return — other
        # branches already pull some — and the public twin of this repository lets workflow runs
        # from forked pull requests restore caches created on main. A cached clone would hand those
        # runs the private source without their ever holding a credential for it, so the clones are
        # fetched afresh on every run instead.
        #
        # `registry/` is crates.io content and safe to cache. `target/` holds compiled rlib/rmeta
        # files, never sources: a far smaller disclosure should a private dependency return, and
        # too expensive to rebuild every run. The key names what built `target/`: v2 is ffi-ci's
        # arm64-only, LTO-off build, so bump it whenever CI's build settings change, and the
        # toolchain's cachekey starts a fresh cache with each stable Rust release, whose compiler
        # cannot reuse the old one's artifacts.
        path: |
          target
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
        key: ${{ runner.os }}-cargo-v2-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-v2-${{ steps.toolchain.outputs.cachekey }}-

    # Build the arm64 macOS slice without fat LTO (`make ffi-ci`), which is all
    # the Swift build and the offline tests need. Releases still build every
    # slice with LTO.
    - name: Build FFI for macOS
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      timeout-minutes: 60
      run: make ffi-ci

    # Verify xcframework exists (whether from cache or fresh build)
    - name: Verify XCFramework
      run: make verify-ffi

    # The Rust unit tests cover the FFI layer below the Swift package, so no
    # `swift test` filter reaches them. Without this step a failing Rust test
    # can sit on a branch indefinitely. Every run executes them, pushes to main
    # included, so main's cargo cache holds the test profile every pull request
    # starts from.
    - name: Run Rust unit tests
      timeout-minutes: 30
      run: make test-rust

    # Set up LocalPackages so Package.swift auto-detects the local build
    - name: Configure local FFI for CI
      run: make configure-local-ffi

    # Build the Swift package
    - name: Build ZODLSwiftWalletSDK Swift Package
      timeout-minutes: 15
      run: make build SWIFT_BUILD_FLAGS=-v

    # Run tests
    - name: Run OfflineTests suite
      timeout-minutes: 10
      run: make test-offline
