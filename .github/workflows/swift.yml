name: Build and Run Offline Tests

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SECURITY.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

  # Pushes to main build too, so that main always holds warm caches: a
  # pull_request run can restore only its own caches and its base branch's, and
  # without these every pull request's first run compiled the whole Rust graph
  # from scratch. Keep this list identical to the one above.
  push:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SECURITY.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

# Superseded PR revisions can stop; main cache-warming runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Checks that the Rust sources are rustfmt-clean. `--check` only reports; it never
  # rewrites. Run `make format-rust` (or `cargo fmt --all`) to fix a failure.
  rustfmt:
    name: rustfmt
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    # The runner image already ships rustup, so no toolchain action is needed.
    - name: Setup Rust
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt
        rustup override set stable

    - name: Rustfmt
      timeout-minutes: 5
      run: make check-format-rust

  build:
    permissions:
      contents: read

    # Xcode 27 ships only on this image, which GitHub still marks as a public
    # preview (https://github.com/actions/runner-images/issues/14404). If it
    # misbehaves, macos-26 with Xcode 26.6 is the fallback.
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Report Xcode and compute cache identity
      id: xcode-cache-key
      run: |
        xcode_version_file=$(mktemp)
        trap 'rm -f "$xcode_version_file"' EXIT
        xcodebuild -version -skipMacroValidation -derivedDataPath "${RUNNER_TEMP}/DerivedData" > "$xcode_version_file"
        cat "$xcode_version_file"
        echo "hash=$(shasum -a 256 "$xcode_version_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Run release-script tests
      run: make test-scripts

    # Needed unconditionally: even on an FFI cache hit, the Rust test step below
    # compiles the crate's test profile and so needs the toolchain. Only the
    # arm64 macOS target: `make ffi-ci` builds nothing else.
    #
    # The runner image already ships rustup, so no toolchain action is needed.
    # Incremental compilation stays off, because its files would only swell the
    # cached target directory. Hash the complete compiler identity so every
    # compiler, host and LLVM change starts a compatible cache namespace.
    - name: Setup Rust
      id: toolchain
      run: |
        rustup toolchain install stable --profile minimal --no-self-update --target aarch64-apple-darwin
        rustup default stable
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        rustc_version_file=$(mktemp)
        trap 'rm -f "$rustc_version_file"' EXIT
        rustc +stable --version --verbose > "$rustc_version_file"
        cat "$rustc_version_file"
        echo "cachekey=$(shasum -a 256 "$rustc_version_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # Hash every input of the FFI build for the XCFramework cache key.
    - name: Generate FFI source hash
      id: ffi-hash
      run: |
        FFI_HASH=$(./Scripts/ci/ffi-input-hash.sh)
        echo "hash=$FFI_HASH" >> "$GITHUB_OUTPUT"
        echo "FFI source hash: $FFI_HASH"

    # Cache the XCFramework `make ffi-ci` builds: the arm64 macOS slice, without
    # fat LTO. The key names that build, so a cache of a different one is never
    # restored in its place.
    - name: Cache FFI XCFramework
      id: cache-ffi
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: BuildSupport/products/libzcashlc.xcframework
        key: ffi-xcframework-macos-arm64-nolto-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-key.outputs.hash }}-${{ steps.toolchain.outputs.cachekey }}-${{ steps.ffi-hash.outputs.hash }}

    # Used by both the FFI build and the Rust tests, so it is not conditional on
    # the FFI cache.
    - name: Cache Cargo
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        # Deliberately enumerated rather than caching `~/.cargo` wholesale (which is what
        # Swatinem/rust-cache did): that includes `~/.cargo/git`, where cargo keeps its clones of
        # git dependencies. Every git dependency on main is public today (slipstream, once a
        # private git dependency, now comes from crates.io), but a private one can return — other
        # branches already pull some — and the public twin of this repository lets workflow runs
        # from forked pull requests restore caches created on main. A cached clone would hand those
        # runs the private source without their ever holding a credential for it, so the clones are
        # fetched afresh on every run instead.
        #
        # `registry/` is crates.io content and safe to cache. `target/` holds compiled rlib/rmeta
        # files, never sources: a far smaller disclosure should a private dependency return, and
        # too expensive to rebuild every run. The namespace names ffi-ci's arm64-only,
        # LTO-off build. Every fallback retains the complete compiler identity,
        # architecture and build variant so incompatible artifacts cannot cross over.
        path: |
          target
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-key.outputs.hash }}-cargo-ci-macos-arm64-nolto-v3-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache-key.outputs.hash }}-cargo-ci-macos-arm64-nolto-v3-${{ steps.toolchain.outputs.cachekey }}-

    # Build the arm64 macOS slice without fat LTO (`make ffi-ci`), which is all
    # the Swift build and the offline tests need. Releases still build every
    # slice with LTO.
    - name: Build FFI for macOS
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      timeout-minutes: 60
      run: make ffi-ci

    # Verify xcframework exists (whether from cache or fresh build)
    - name: Verify XCFramework
      run: make verify-ffi

    # The Rust unit tests cover the FFI layer below the Swift package, so no
    # `swift test` filter reaches them. Without this step a failing Rust test
    # can sit on a branch indefinitely. Every run executes them, pushes to main
    # included, so main's cargo cache holds the test profile every pull request
    # starts from.
    - name: Run Rust unit tests
      timeout-minutes: 30
      run: make test-rust

    # Set up LocalPackages so Package.swift auto-detects the local build
    - name: Configure local FFI for CI
      run: make configure-local-ffi

    # Capture the actual compiler so dependency caches cannot cross toolchains.
    - name: Compute Swift cache identity
      id: swift-cache-key
      continue-on-error: true
      run: |
        swift_version_file=$(mktemp)
        trap 'rm -f "$swift_version_file"' EXIT
        swift --version > "$swift_version_file"
        cat "$swift_version_file"
        echo "hash=$(shasum -a 256 "$swift_version_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # Cache only downloaded dependencies. Build products, workspace state and
    # the local FFI override must be recreated by their normal build steps.
    - name: Restore SwiftPM dependencies
      id: cache-swift
      if: steps.swift-cache-key.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: |
          .build/repositories
          .build/checkouts
          .build/artifacts
        key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-dependencies-v1-${{ steps.xcode-cache-key.outputs.hash }}-${{ steps.swift-cache-key.outputs.hash }}-${{ hashFiles('Package.swift', 'Package.resolved', 'BuildSupport/LocalPackages-Package.swift', 'LocalPackages/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-swiftpm-dependencies-v1-${{ steps.xcode-cache-key.outputs.hash }}-${{ steps.swift-cache-key.outputs.hash }}-

    - name: Resolve SwiftPM dependencies
      id: resolve-swift
      timeout-minutes: 15
      run: make resolve

    # Save before compilation so a later compiler/test failure still leaves
    # resolved dependencies warm. Cache service failures do not fail the build.
    - name: Save SwiftPM dependencies
      if: steps.resolve-swift.outcome == 'success' && steps.cache-swift.outputs.cache-hit != 'true' && steps.swift-cache-key.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: |
          .build/repositories
          .build/checkouts
          .build/artifacts
        key: ${{ steps.cache-swift.outputs.cache-primary-key }}

    # Build the Swift package
    - name: Build ZODLSwiftWalletSDK Swift Package
      timeout-minutes: 15
      run: make build SWIFT_BUILD_FLAGS=-v

    # Run tests
    - name: Run OfflineTests suite
      timeout-minutes: 10
      run: make test-offline
